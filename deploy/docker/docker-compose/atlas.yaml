services:
  atlas:
    image: atlas:v1.0.0
    container_name: atlas
    restart: unless-stopped
    ports:
      - "18400:18400"
    volumes:
      - /home/machine/data_volume/atlas/config:/app/config
      - /home/machine/data_volume/atlas/logs:/app/logs
    environment:
      - ATLAS_ENV=production
      - OLLAMA_API_KEY=${OLLAMA_API_KEY:-ollama}
      - PDF_MODEL_API_KEY=${PDF_MODEL_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18400/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
