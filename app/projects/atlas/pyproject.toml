[project]
name = "atlas"
version = "1.0.0"
description = "Atlas — Industry Chain Knowledge Graph Engine for investment analysis"
readme = "README.md"
authors = [{name = "Atlas Team"}]
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.23.0",
  "httpx>=0.25.0",
  "pydantic>=2.6.0",
  "PyYAML>=6.0.0",
  "pikepdf>=9.0.0",
  "minio>=7.2.0",
  "pdfplumber>=0.11.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["atlas*"]
exclude = ["tests"]
