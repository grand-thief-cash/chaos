tasks:
      # 其他 period/adjust 组合可按需扩展
  STOCK_ZH_A_LIST:
    variants:
      - match: {}
        config:
          exchange: "ALL"
          # 统一刷新 security_registry 的核心现货身份。港股通、逆回购、
          # 期货和期权已由任务代码支持，需要时在调用参数中显式加入。
          security_types: ["stock", "index", "etf", "cb"]
  # History Data
  STOCK_ZH_A_HIST_PARENT:
#    adjustflag：复权类型，默认不复权：3；1：后复权；2：前复权
#    frequency：数据类型，默认为d，日k线；d=日k线、w=周、m=月、5=5分钟、15=15分钟、30=30分钟、60=60分钟k线数据，不区分大小写
    variants:
      - match: { period: "daily", adjust: "nf" }
        config:
           period: "daily"
           adjust: "nf"
           exchange: "SH,SZ,BJ"
           start_date: "2016-01-01"
           fields: "date,open,high,low,close,preclose,volume,amount,turn,pctChg,peTTM,pbMRQ,psTTM,pcfNcfTTM,tradestatus,isST"

      - match: { period: "daily", adjust: "hfq" }
        config:
           period: "daily"
           adjust: "hfq"
           exchange: "SH,SZ"
           start_date: "2009-01-01"
           fields: "date,open,high,low,close,preclose,volume,amount,turn,pctChg,peTTM,pbMRQ,psTTM,pcfNcfTTM,tradestatus,isST"

  # Intraday execution/replay input. Minute fields intentionally differ from
  # daily fields and raw prices are mandatory for simulated fills.
  STOCK_ZH_A_MINUTE_PARENT:
    variants:
      - match: { period: "min5", adjust: "nf" }
        config:
          period: "min5"
          adjust: "nf"
          exchange: "SH,SZ,BJ"
          start_date: "2021-01-01"
          end_date: null
          fields: "date,time,open,high,low,close,volume,amount,adjustflag"

