          data_provider_code: "phoenixa_hist_daily"
          analyzer_profile: "default_hist_v1"
          persist_artifacts: ["analyzers", "trades", "equity_curve", "plot_manifest", "plot_series"]

  # Eastmoney research-report PDF download - ONE task for all feeds.
  # 单次运行：LIST 阶段按 [list_cursor, today] 从旧到新翻页 upsert 元数据（pending），
  # PROCESS 阶段取最早 N 份 pending 研报：详情页->PDF->MinIO->phoenixA 标记 downloaded。
  # 断点续传：pending/error 研报下次运行继续。受东财反爬限速，单次耗时取决于 download_limit。
  # 全量回补在多次运行中完成（list_cursor 单调推进，不会卡在旧页）。
  #
  # One variant per feed, selected by the `type` incoming param (cronjob body
  # carries {"type": "stock"} etc.). There is no longer a separate
  # STOCK_ZH_A_EASTMONEY_REPORT task - stock runs through this task with
  # type=stock (same code path, same MinIO layout). Two task codes for the one
  # shared download engine was what let cronjobs get misrouted to the wrong
  # endpoint, so they're consolidated here.
  EASTMONEY_RESEARCH_REPORT:
    variants:
      - match: { type: "stock" }
        config:
          earliest_date: "2024-07-01"
          download_limit: 20
          list_page_limit: 10
          page_size: 50
          list_page_sleep: [3.0, 6.0]
          detail_page_sleep: [7.0, 15.0]
          pdf_download_sleep: [9.0, 18.0]
          retry_sleep: [45.0, 120.0]
      - match: { type: "industry" }
        config:
          earliest_date: "2024-07-01"
          download_limit: 10
          list_page_limit: 1
          page_size: 50
          list_page_sleep: [3.0, 6.0]
          detail_page_sleep: [7.0, 15.0]
          pdf_download_sleep: [9.0, 18.0]
          retry_sleep: [45.0, 120.0]
      - match: { type: "macro" }
        config:
          earliest_date: "2024-07-01"
          download_limit: 10
          list_page_limit: 1
          page_size: 50
          list_page_sleep: [3.0, 6.0]
          detail_page_sleep: [7.0, 15.0]
          pdf_download_sleep: [9.0, 18.0]
          retry_sleep: [45.0, 120.0]
      - match: { type: "new_stock" }
        config:
          earliest_date: "2024-07-01"
          download_limit: 10
          list_page_limit: 1
          page_size: 50
          list_page_sleep: [3.0, 6.0]
          detail_page_sleep: [7.0, 15.0]
          pdf_download_sleep: [9.0, 18.0]
          retry_sleep: [45.0, 120.0]
      - match: { type: "strategy" }
        config:
          earliest_date: "2024-07-01"
          download_limit: 10
          list_page_limit: 1
          page_size: 50
          list_page_sleep: [3.0, 6.0]
          detail_page_sleep: [7.0, 15.0]
          pdf_download_sleep: [9.0, 18.0]
          retry_sleep: [45.0, 120.0]
      - match: { type: "morning_report" }
        config:
          earliest_date: "2024-07-01"
          download_limit: 10
          list_page_limit: 2
          page_size: 50
          list_page_sleep: [3.0, 6.0]
          detail_page_sleep: [7.0, 15.0]
          pdf_download_sleep: [9.0, 18.0]
          retry_sleep: [45.0, 120.0]

